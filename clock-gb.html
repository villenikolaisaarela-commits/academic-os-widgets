<!doctype html>
<html lang="en-GB" data-lang="en-GB" data-h="24">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<style>
  /* Transparent background: the clock sits directly on the Notion page.
     Ink follows the viewer's light/dark setting. */
  :root {
    --ink: #2a2724; --muted: #7d766d;
    --tick: rgba(42,39,36,.24); --tick-major: rgba(42,39,36,.55);
    --accent: #b0592f;
  }
  /* An embedded page cannot see Notion's own light/dark setting, so the ink follows
     the viewer's device by default. Add ?theme=dark or ?theme=light to force one. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f5f3f0; --muted: #9a958d;
      --tick: rgba(245,243,240,.22); --tick-major: rgba(245,243,240,.55);
      --accent: #d08a63;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f5f3f0; --muted: #9a958d;
    --tick: rgba(245,243,240,.22); --tick-major: rgba(245,243,240,.55);
    --accent: #d08a63;
  }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    font: 400 13px/1.35 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px; }
  .face { position: relative; width: min(74vw, 62vh, 200px); aspect-ratio: 1; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tick { stroke: var(--tick); stroke-width: 1; stroke-linecap: round; }
  .tick.major { stroke: var(--tick-major); stroke-width: 2.4; }
  .hand { stroke: var(--ink); stroke-linecap: round; }
  .hand.sec { stroke: var(--accent); }
  .pin { fill: var(--ink); }
  .pin-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .read { text-align: center; }
  .time {
    font-size: clamp(20px, 7vw, 30px); font-weight: 300; letter-spacing: .04em;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .date { margin-top: 7px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="face" aria-label="Clock">
    <svg viewBox="-100 -100 200 200" aria-hidden="true">
      <g id="ticks"></g>
      <line id="h" class="hand" x1="0" y1="10" x2="0" y2="-44" stroke-width="3.4"/>
      <line id="m" class="hand" x1="0" y1="13" x2="0" y2="-68" stroke-width="2.2"/>
      <line id="s" class="hand sec" x1="0" y1="18" x2="0" y2="-76" stroke-width="1"/>
      <circle class="pin" r="2.6"/>
      <circle class="pin-ring" r="6"/>
    </svg>
  </div>
  <div class="read">
    <div class="time" id="time" role="timer" aria-live="off">--:--:--</div>
    <div class="date" id="date"></div>
  </div>
</div>
<script>
(function () {
  // Region handling:
  //   default  -> language, date order and 12/24-hour format follow the viewer's device
  //   ?lang=en-US / ?h=12 / ?h=24        -> force locale or hour format
  //   <html data-lang="en-US" data-h="12"> -> per-file defaults (clock-us.html, clock-intl.html),
  //   because Notion embeds may drop the query string.
  var q = new URLSearchParams(location.search), d = document.documentElement.dataset;
  var theme = q.get("theme");
  if (theme === "dark" || theme === "light") d.theme = theme;
  var locale = q.get("lang") || d.lang || undefined;
  var hParam = q.get("h") || d.h;
  var hour12 = hParam === "12" ? true : hParam === "24" ? false : undefined;
  var timeFmt = new Intl.DateTimeFormat(locale, { hour: "numeric", minute: "2-digit", second: "2-digit", hour12: hour12 });
  var dateFmt = new Intl.DateTimeFormat(locale, { weekday: "short", month: "short", day: "numeric" });

  // Edition files format English by hand: some embed hosts (Notion desktop) ignore the requested
  // Intl locale and fall back to the device language.
  if (hParam === "12" || hParam === "24") {
    var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    var pad = function (n) { return (n < 10 ? "0" : "") + n; };
    timeFmt = { format: function (t) {
      var h = t.getHours(), ms = ":" + pad(t.getMinutes()) + ":" + pad(t.getSeconds());
      return hParam === "12" ? ((h % 12) || 12) + ms + " " + (h < 12 ? "AM" : "PM") : pad(h) + ms;
    } };
    dateFmt = { format: function (t) {
      var wd = DAYS[t.getDay()], mo = MONTHS[t.getMonth()], dd = t.getDate();
      return hParam === "12" ? wd + ", " + mo + " " + dd : wd + " " + dd + " " + mo;
    } };
  }

  var g = document.getElementById("ticks"), ns = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 60; i++) {
    var major = i % 5 === 0, l = document.createElementNS(ns, "line");
    l.setAttribute("x1", 0); l.setAttribute("x2", 0);
    l.setAttribute("y1", major ? -90 : -92); l.setAttribute("y2", major ? -80 : -88);
    l.setAttribute("transform", "rotate(" + i * 6 + ")");
    l.setAttribute("class", major ? "tick major" : "tick");
    g.appendChild(l);
  }
  var H = document.getElementById("h"), M = document.getElementById("m"), S = document.getElementById("s");
  function tick() {
    var t = new Date(), s = t.getSeconds() + t.getMilliseconds() / 1000,
        m = t.getMinutes() + s / 60, h = (t.getHours() % 12) + m / 60;
    H.setAttribute("transform", "rotate(" + h * 30 + ")");
    M.setAttribute("transform", "rotate(" + m * 6 + ")");
    S.setAttribute("transform", "rotate(" + s * 6 + ")");   // sweeps instead of stepping
    document.getElementById("time").textContent = timeFmt.format(t);
    document.getElementById("date").textContent = dateFmt.format(t);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
