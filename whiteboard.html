<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Whiteboard · Framewise</title>
<style>
  /* Framewise whiteboard. Self-contained: no network requests, no tracking.
     Boards are kept in this browser (localStorage) and can be saved as PNG.
     No browser dialogs or download links inside Notion: its embed frame blocks both.

     Colours are stored as names ("ink", "green", …) rather than hex values, so a
     drawing re-colours itself when the theme changes: black ink on a light board
     becomes light ink on a dark board instead of disappearing.

     The page paints Notion's own background (#ffffff / #191919): an embedded frame
     is never transparent. ?theme=dark|light pins the theme; ?paper=grid|lines|dots|blank
     sets the default paper for new boards. */
  :root {
    color-scheme: light;
    --page: #ffffff; --board: #fcfcfa; --rule: rgba(47,74,58,.11);
    --bar: #f3f4f0; --line: rgba(24,32,27,.12); --ink: #1d2420; --muted: #6b7069;
    --chip: rgba(24,32,27,.06); --chip-on: rgba(24,32,27,.13);
    --accent: #4f6b57; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #191919; --board: #1e1f1e; --rule: rgba(200,220,205,.09);
      --bar: #232523; --line: rgba(240,244,240,.12); --ink: #eef0ec; --muted: #9ba19a;
      --chip: rgba(240,244,240,.07); --chip-on: rgba(240,244,240,.15);
      --accent: #8faf95; --on-accent: #16211a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #191919; --board: #1e1f1e; --rule: rgba(200,220,205,.09);
    --bar: #232523; --line: rgba(240,244,240,.12); --ink: #eef0ec; --muted: #9ba19a;
    --chip: rgba(240,244,240,.07); --chip-on: rgba(240,244,240,.15);
    --accent: #8faf95; --on-accent: #16211a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page); touch-action: none; }
  body { font: 13px/1.2 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--ink); -webkit-font-smoothing: antialiased; }
  #app { height: 100%; display: flex; flex-direction: column; padding: 8px; gap: 10px; }

  /* Board tabs */
  #tabs { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 0; border-radius: 999px; padding: 7px 13px; background: var(--chip); color: var(--muted);
         font: inherit; cursor: pointer; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .tab:hover { color: var(--ink); }
  .tab.on { background: var(--chip-on); color: var(--ink); font-weight: 600; }
  .tab.add { color: var(--accent); font-weight: 600; }
  .tabs-spacer { flex: 1; }
  .ghost { border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .ghost:hover { background: var(--chip); color: var(--ink); }

  /* Canvas */
  #stage { position: relative; flex: 1; min-height: 120px; border-radius: 12px; overflow: hidden;
           background-color: var(--board); box-shadow: inset 0 0 0 1px var(--line); }
  #stage.grid  { background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
                 background-size: 24px 24px; }
  #stage.lines { background-image: linear-gradient(var(--rule) 1px, transparent 1px); background-size: 100% 30px; }
  #stage.dots  { background-image: radial-gradient(var(--rule) 1.3px, transparent 1.4px); background-size: 22px 22px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #live { pointer-events: none; }
  #ink { cursor: crosshair; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
           color: var(--muted); font-size: 13px; letter-spacing: .02em; opacity: .8; transition: opacity .25s; }

  /* Toolbar */
  #bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; row-gap: 8px;
         padding: 8px 12px; border-radius: 12px; background: var(--bar); box-shadow: inset 0 0 0 1px var(--line); }
  .group { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .divider { width: 1px; height: 22px; background: var(--line); flex: none; }
  .tool { border: 0; border-radius: 8px; height: 30px; min-width: 30px; padding: 0 9px; background: none; color: var(--muted);
          font: inherit; cursor: pointer; display: inline-grid; place-items: center; }
  .tool:hover { background: var(--chip); color: var(--ink); }
  .tool.on { background: var(--chip-on); color: var(--ink); font-weight: 600; }
  .tool:disabled { opacity: .35; cursor: default; background: none; }
  .tool svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
            outline: 2px solid transparent; outline-offset: 2px; transition: transform .12s ease; }
  .swatch:hover { transform: scale(1.1); }
  .swatch.on { outline-color: var(--ink); }
  .size i { display: block; border-radius: 50%; background: currentColor; }
  .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .primary { border: 0; border-radius: 8px; height: 30px; padding: 0 13px; background: var(--accent); color: var(--on-accent);
             font: inherit; font-weight: 600; cursor: pointer; flex: none; }
  .primary:hover { filter: brightness(1.06); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  select.tool { appearance: none; -webkit-appearance: none; padding: 0 10px; }
  .primary { display: inline-flex; align-items: center; gap: 6px; }
  .primary svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ghost.danger { color: #c0463b; font-weight: 600; }
  .tab-edit { flex: none; width: 170px; border: 0; border-radius: 999px; padding: 7px 13px; font: inherit; font-weight: 600;
              color: var(--ink); background: var(--chip-on); outline: 2px solid var(--accent); outline-offset: 0; }
  #toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 8px); padding: 8px 14px; border-radius: 999px;
           background: var(--ink); color: var(--page); font-size: 12.5px; white-space: nowrap; pointer-events: none;
           opacity: 0; z-index: 6; transition: opacity .2s ease, transform .2s ease; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #sheet { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 10px;
           background: color-mix(in srgb, var(--page) 80%, transparent); }
  #sheet[hidden] { display: none; }
  .sheet-card { width: min(620px, 100%); height: min(100%, 460px); display: flex; flex-direction: column; gap: 8px; padding: 10px;
                border-radius: 14px; background: var(--bar); box-shadow: inset 0 0 0 1px var(--line), 0 18px 40px -18px rgba(0,0,0,.35); }
  .sheet-card img { display: block; width: 100%; flex: 1 1 0; min-height: 0; object-fit: contain; border-radius: 8px; background: var(--board); }
  .sheet-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: none; }
  .sheet-hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.4; flex: none; }
  @media (max-height: 300px) { .sheet-hint { display: none; } }
  @media (max-width: 820px) {
    #bar { gap: 7px; padding: 8px 10px; }
    .tool { padding: 0 8px; min-width: 28px; }
    .swatch { width: 20px; height: 20px; }
    .hide-mid { display: none; }
  }
  @media (max-width: 520px) { .hide-narrow { display: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="tabs" role="tablist" aria-label="Boards"></div>
  <div id="stage" class="grid">
    <canvas id="ink" aria-label="Drawing board"></canvas>
    <canvas id="live" aria-hidden="true"></canvas>
    <div id="empty">Draw anywhere. Boards save automatically.</div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <div id="bar" role="toolbar" aria-label="Drawing tools">
    <span class="group" id="tools"></span>
    <span class="divider"></span>
    <span class="group" id="colors"></span>
    <span class="divider hide-narrow"></span>
    <span class="group hide-narrow" id="sizes"></span>
    <span class="divider hide-narrow"></span>
    <span class="group">
      <button class="tool" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="tool" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="tool" id="paper" title="Paper: grid, lines, dots or blank">Grid</button>
      <button class="tool" id="clear" title="Clear this board">Clear</button>
    </span>
    <span class="spacer"></span>
    <span id="status" class="hide-narrow hide-mid">Saved</span>
    <button class="primary" id="png" title="Save this board as a PNG image" aria-label="Save as PNG"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>PNG</button>
  </div>
  <div id="sheet" hidden role="dialog" aria-label="Save this board as a PNG">
    <div class="sheet-card">
      <img id="shot" alt="This board as a PNG image">
      <div class="sheet-row">
        <button class="primary" id="sheet-open">Open in new tab</button>
        <button class="tool" id="sheet-copy" hidden>Copy image</button>
        <span class="spacer"></span>
        <button class="tool" id="sheet-close">Close</button>
      </div>
      <p class="sheet-hint">Open it in a new tab to download it, or right-click the image and choose Save image as. On a phone, press and hold it.</p>
    </div>
  </div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), root = document.documentElement;
  var t = q.get("theme"); if (t === "dark" || t === "light") root.dataset.theme = t;
  function isDark() {
    if (root.dataset.theme) return root.dataset.theme === "dark";
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  }

  // Named colours, rendered per theme so drawings survive a theme switch.
  var PALETTE = {
    ink:    ["#1d2420", "#eef0ec"],
    green:  ["#3f7a55", "#8fcf9f"],
    blue:   ["#2f63b0", "#8fb4f0"],
    red:    ["#c0463b", "#f09a90"],
    amber:  ["#c98a1c", "#f2c56b"],
    violet: ["#6b4fb0", "#b9a3f0"]
  };
  var ORDER = ["ink", "green", "blue", "red", "amber", "violet"];
  var SIZES = [2, 4, 8];
  var PAPERS = ["grid", "lines", "dots", "blank"];
  function hex(name) { var p = PALETTE[name] || PALETTE.ink; return isDark() ? p[1] : p[0]; }

  // ---------------------------------------------------------------- storage
  var KEY = "framewise-whiteboard" + (location.search.replace(/[?&](theme|v)=[^&]*/g, "") || "");
  var LEGACY = "academic-os-whiteboard" + (location.search || "");
  var state = null;
  function blank(name) {
    return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name,
             paper: PAPERS.indexOf(q.get("paper")) >= 0 ? q.get("paper") : "grid", strokes: [], redo: [] };
  }
  try { state = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { state = null; }
  if (!state || !state.boards || !state.boards.length) {
    state = { active: 0, boards: [blank("Board 1")] };
    try {                                   // carry over a drawing from the old widget
      var old = JSON.parse(localStorage.getItem(LEGACY) || "null");
      if (old && old.length) state.boards[0].strokes = old.map(function (s) {
        return { tool: s.erase ? "eraser" : "pen", color: "ink", width: s.width, points: s.points };
      });
    } catch (e) {}
  }
  state.boards.forEach(function (b) { b.redo = b.redo || []; b.paper = b.paper || "grid"; });
  function board() { return state.boards[Math.min(state.active, state.boards.length - 1)]; }

  var status = document.getElementById("status"), saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    status.textContent = "Saving…";
    saveTimer = setTimeout(function () {
      try {
        state.boards.forEach(function (b) { if (b.strokes.length > 1500) b.strokes = b.strokes.slice(-1500); b.redo = b.redo.slice(-100); });
        localStorage.setItem(KEY, JSON.stringify(state));
        status.textContent = "Saved";
      } catch (e) { status.textContent = "Not saved: browser storage is blocked"; }
    }, 250);
  }

  // ---------------------------------------------------------------- canvas
  var stage = document.getElementById("stage"), inkC = document.getElementById("ink"), liveC = document.getElementById("live");
  var ink = inkC.getContext("2d"), live = liveC.getContext("2d"), dpr = 1, W = 0, H = 0;
  var tool = "pen", color = "ink", size = 4, drawing = false, current = null;

  function setup(c, g) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.lineCap = g.lineJoin = "round"; }
  function resize() {
    dpr = window.devicePixelRatio || 1; W = stage.clientWidth; H = stage.clientHeight;
    setup(inkC, ink); setup(liveC, live); redraw();
  }
  function strokePath(g, pts) {
    g.beginPath();
    if (pts.length < 3) {
      g.moveTo(pts[0][0], pts[0][1]);
      var last = pts[pts.length - 1]; g.lineTo(last[0] + 0.01, last[1] + 0.01);
    } else {
      g.moveTo(pts[0][0], pts[0][1]);
      for (var i = 1; i < pts.length - 1; i++) {
        var mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      var e = pts[pts.length - 1]; g.lineTo(e[0], e[1]);
    }
    g.stroke();
  }
  function paint(g, s) {
    g.save();
    if (s.tool === "eraser") { g.globalCompositeOperation = "destination-out"; g.strokeStyle = "#000"; g.lineWidth = s.width * 5; }
    else if (s.tool === "marker") { g.globalAlpha = isDark() ? 0.32 : 0.28; g.strokeStyle = hex(s.color); g.lineWidth = s.width * 4 + 6; }
    else { g.strokeStyle = hex(s.color); g.lineWidth = s.width; }
    strokePath(g, s.points);
    g.restore();
  }
  // "Clear" is stored as a marker in the stroke list, so a single Undo brings the board back.
  function visible(b) { var st = b.strokes, i = st.length - 1; while (i >= 0 && !st[i].clear) i--; return st.slice(i + 1); }
  function redraw() {
    ink.clearRect(0, 0, W, H);
    visible(board()).forEach(function (s) { paint(ink, s); });
    live.clearRect(0, 0, W, H);
    stage.className = board().paper;
    document.getElementById("paper").textContent = board().paper.charAt(0).toUpperCase() + board().paper.slice(1);
    document.getElementById("empty").style.opacity = visible(board()).length ? 0 : 0.8;
    document.getElementById("undo").disabled = !board().strokes.length;
    document.getElementById("redo").disabled = !board().redo.length;
  }

  function pos(e) { var r = inkC.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * 10) / 10, Math.round((e.clientY - r.top) * 10) / 10]; }
  inkC.addEventListener("pointerdown", function (e) {
    if (e.button && e.button !== 0) return;
    inkC.setPointerCapture(e.pointerId);
    drawing = true;
    current = { tool: tool, color: color, width: size, points: [pos(e)] };
    document.getElementById("empty").style.opacity = 0;
  });
  inkC.addEventListener("pointermove", function (e) {
    if (!drawing) return;
    var p = pos(e), last = current.points[current.points.length - 1];
    if (Math.abs(p[0] - last[0]) + Math.abs(p[1] - last[1]) < 1.2) return;
    current.points.push(p);
    if (current.tool === "eraser") {                 // erase straight into the ink layer
      paint(ink, { tool: "eraser", width: current.width, points: current.points.slice(-3) });
    } else {                                         // preview the whole stroke on the live layer
      live.clearRect(0, 0, W, H); paint(live, current);
    }
  });
  function finish() {
    if (!drawing) return;
    drawing = false;
    live.clearRect(0, 0, W, H);
    board().strokes.push(current); board().redo = [];
    if (current.tool !== "eraser") paint(ink, current);
    current = null; redraw(); save();
  }
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (ev) { inkC.addEventListener(ev, finish); });

  // ---------------------------------------------------------------- toolbar
  var ICON = {
    pen: '<svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>',
    marker: '<svg viewBox="0 0 24 24"><path d="M9 15l-4 4h5l2-2"/><path d="M9 15l7-10 4 3-7 10z"/></svg>',
    eraser: '<svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.5 15.5l9-9a2 2 0 0 1 3 0l3 3a2 2 0 0 1 0 3L13 19H9z"/></svg>'
  };
  var NAMES = { pen: "Pen", marker: "Highlighter", eraser: "Eraser" };
  var toolsEl = document.getElementById("tools");
  ["pen", "marker", "eraser"].forEach(function (k) {
    var b = document.createElement("button"); b.className = "tool" + (k === tool ? " on" : "");
    b.innerHTML = ICON[k]; b.title = NAMES[k]; b.setAttribute("aria-label", NAMES[k]); b.dataset.tool = k;
    b.onclick = function () { tool = k; [].forEach.call(toolsEl.children, function (x) { x.classList.toggle("on", x === b); }); };
    toolsEl.appendChild(b);
  });
  var colorsEl = document.getElementById("colors");
  function paintSwatches() { [].forEach.call(colorsEl.children, function (b) { b.style.background = hex(b.dataset.color); }); }
  ORDER.forEach(function (k) {
    var b = document.createElement("button"); b.className = "swatch" + (k === color ? " on" : "");
    b.dataset.color = k; b.title = k.charAt(0).toUpperCase() + k.slice(1); b.setAttribute("aria-label", "Colour " + k);
    b.onclick = function () {
      color = k; if (tool === "eraser") toolsEl.children[0].click();
      [].forEach.call(colorsEl.children, function (x) { x.classList.toggle("on", x === b); });
    };
    colorsEl.appendChild(b);
  });
  var sizesEl = document.getElementById("sizes");
  SIZES.forEach(function (s) {
    var b = document.createElement("button"); b.className = "tool size" + (s === size ? " on" : "");
    b.title = "Stroke " + s + " px"; b.setAttribute("aria-label", b.title);
    var dot = document.createElement("i"); dot.style.width = dot.style.height = (s + 3) + "px"; b.appendChild(dot);
    b.onclick = function () { size = s; [].forEach.call(sizesEl.children, function (x) { x.classList.toggle("on", x === b); }); };
    sizesEl.appendChild(b);
  });

  function undo() { var b = board(); if (!b.strokes.length) return; b.redo.push(b.strokes.pop()); redraw(); save(); }
  function redo() { var b = board(); if (!b.redo.length) return; b.strokes.push(b.redo.pop()); redraw(); save(); }
  document.getElementById("undo").onclick = undo;
  document.getElementById("redo").onclick = redo;
  document.getElementById("paper").onclick = function () {
    var b = board(); b.paper = PAPERS[(PAPERS.indexOf(b.paper) + 1) % PAPERS.length]; redraw(); save();
  };
  // Embedded pages cannot open browser dialogs (Notion's frame has no allow-modals),
  // so nothing here uses alert(), confirm() or prompt().
  var toastEl = document.getElementById("toast"), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }
  document.getElementById("clear").onclick = function () {
    var b = board(); if (!visible(b).length) return;
    b.strokes.push({ clear: true }); b.redo = []; redraw(); save();
    toast("Board cleared. Undo brings it back.");
  };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !sheet.hidden) { closeSheet(); return; }
    if (!(e.ctrlKey || e.metaKey) || e.target.tagName === "INPUT") return;
    var k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); redo(); }
  });

  // PNG: board colour + paper pattern + ink, at full resolution.
  // Inside Notion the frame is sandboxed without allow-downloads, so a download link does nothing there.
  // Embedded, the image opens in a small panel instead: open it in a new tab (downloads work there),
  // copy it where the page allows, or right-click / press and hold the image to save it.
  // Opened on its own (not in a frame), the button downloads the file directly.
  function render() {
    var out = document.createElement("canvas"); out.width = inkC.width; out.height = inkC.height;
    var g = out.getContext("2d"), cs = getComputedStyle(root);
    g.fillStyle = cs.getPropertyValue("--board").trim() || "#fff"; g.fillRect(0, 0, out.width, out.height);
    g.save(); g.scale(dpr, dpr); g.strokeStyle = g.fillStyle = isDark() ? "rgba(200,220,205,.10)" : "rgba(47,74,58,.12)"; g.lineWidth = 1;
    var p = board().paper;
    if (p === "grid") { for (var x = 0; x < W; x += 24) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
                        for (var y = 0; y < H; y += 24) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); } }
    if (p === "lines") { for (var y2 = 0; y2 < H; y2 += 30) { g.beginPath(); g.moveTo(0, y2 + .5); g.lineTo(W, y2 + .5); g.stroke(); } }
    if (p === "dots") { for (var x3 = 11; x3 < W; x3 += 22) for (var y3 = 11; y3 < H; y3 += 22) { g.beginPath(); g.arc(x3, y3, 1.3, 0, 6.3); g.fill(); } }
    g.restore();
    g.drawImage(inkC, 0, 0);
    return out;
  }
  function fileName() { return ((board().name || "board").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "board") + ".png"; }
  function download(url) { var a = document.createElement("a"); a.download = fileName(); a.href = url; document.body.appendChild(a); a.click(); a.remove(); }
  var embedded = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var sheet = document.getElementById("sheet"), shot = document.getElementById("shot"), shotURL = null, shotBlob = null;
  var canCopy = !!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) &&
                !(document.featurePolicy && document.featurePolicy.allowsFeature && !document.featurePolicy.allowsFeature("clipboard-write"));
  function closeSheet() { sheet.hidden = true; }
  document.getElementById("png").onclick = function () {
    render().toBlob(function (blob) {
      if (!blob) { toast("Could not create the image"); return; }
      if (shotURL) URL.revokeObjectURL(shotURL);
      shotBlob = blob; shotURL = URL.createObjectURL(blob);
      if (!embedded) { download(shotURL); toast("Saved " + fileName()); return; }
      shot.src = shotURL;
      document.getElementById("sheet-copy").hidden = !canCopy;
      sheet.hidden = false;
    }, "image/png");
  };
  document.getElementById("sheet-open").onclick = function () {
    var w = null;
    try { w = window.open(shotURL, "_blank"); } catch (e) { w = null; }
    if (!w) toast("Pop-ups are blocked here. Right-click the image to save it.");
  };
  document.getElementById("sheet-copy").onclick = function () {
    navigator.clipboard.write([new ClipboardItem({ "image/png": shotBlob })]).then(function () {
      toast("Copied. Paste it anywhere.");
    }, function () {
      document.getElementById("sheet-copy").hidden = true; canCopy = false;
      toast("Copying isn't allowed here. Open it in a new tab instead.");
    });
  };
  document.getElementById("sheet-close").onclick = closeSheet;
  sheet.addEventListener("pointerdown", function (e) { if (e.target === sheet) closeSheet(); });

  // ---------------------------------------------------------------- boards
  var tabsEl = document.getElementById("tabs"), editing = -1, delArmed = false, delTimer = null;
  function renderTabs() {
    tabsEl.textContent = "";
    state.boards.forEach(function (b, i) {
      if (i === editing) {                           // inline name field instead of prompt()
        var inp = document.createElement("input"); inp.className = "tab-edit"; inp.value = b.name; inp.maxLength = 40;
        inp.setAttribute("aria-label", "Board name"); inp.spellcheck = false;
        var closed = false;
        var commit = function (keep) {
          if (closed) return; closed = true;
          var v = inp.value.trim(); if (keep && v) b.name = v;
          editing = -1; renderTabs(); save();
        };
        inp.onkeydown = function (e) {
          if (e.key === "Enter") { e.preventDefault(); commit(true); }
          else if (e.key === "Escape") { e.preventDefault(); commit(false); }
        };
        inp.onblur = function () { commit(true); };
        tabsEl.appendChild(inp);
        setTimeout(function () { inp.focus(); inp.select(); }, 0);
        return;
      }
      var el = document.createElement("button"); el.className = "tab" + (i === state.active ? " on" : "");
      el.textContent = b.name; el.title = i === state.active ? "Double-click to rename" : b.name; el.setAttribute("role", "tab");
      el.onclick = function () { if (state.active !== i) { state.active = i; renderTabs(); redraw(); save(); } };
      el.ondblclick = function () { state.active = i; editing = i; renderTabs(); redraw(); };
      tabsEl.appendChild(el);
    });
    var add = document.createElement("button"); add.className = "tab add"; add.textContent = "+ New board";
    add.title = "Add a board, for example one per course";
    add.onclick = function () {
      state.boards.push(blank("Board " + (state.boards.length + 1)));
      state.active = editing = state.boards.length - 1; renderTabs(); redraw(); save();
    };
    tabsEl.appendChild(add);
    var sp = document.createElement("span"); sp.className = "tabs-spacer"; tabsEl.appendChild(sp);
    var ren = document.createElement("button"); ren.className = "ghost"; ren.textContent = "Rename";
    ren.onclick = function () { editing = state.active; renderTabs(); };
    tabsEl.appendChild(ren);
    if (state.boards.length > 1) {                   // two-step delete instead of confirm()
      var del = document.createElement("button"); del.className = "ghost" + (delArmed ? " danger" : "");
      del.textContent = delArmed ? "Delete this board?" : "Delete";
      del.onclick = function () {
        if (!delArmed) {
          delArmed = true; renderTabs();
          clearTimeout(delTimer); delTimer = setTimeout(function () { delArmed = false; renderTabs(); }, 4000);
          return;
        }
        clearTimeout(delTimer); delArmed = false;
        var name = board().name;
        state.boards.splice(state.active, 1); state.active = Math.max(0, state.active - 1); renderTabs(); redraw(); save();
        toast("Deleted " + name);
      };
      tabsEl.appendChild(del);
    }
  }

  if (window.matchMedia) {
    var mq = matchMedia("(prefers-color-scheme: dark)");
    (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(function () { paintSwatches(); redraw(); });
  }
  window.addEventListener("resize", resize);
  renderTabs(); paintSwatches(); resize();
  status.textContent = "Saved";
})();
</script>
</body>
</html>
