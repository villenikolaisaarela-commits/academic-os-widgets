<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer</title>
<style>
  :root { --ink: #ffffff; --chip: rgba(0,0,0,.28); --chip-on: rgba(255,255,255,.92); --chip-on-ink: #5a2c1d; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: stretch; justify-content: center;
    background: linear-gradient(160deg, #4a2418 0%, #7a3a26 45%, #9c5033 100%);
    color: var(--ink);
    font: 13px/1.3 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card { width: 100%; max-width: 340px; padding: 18px 16px 16px; box-sizing: border-box;
          display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .time { font-size: clamp(44px, 20vw, 64px); font-weight: 700; letter-spacing: -.02em;
          font-variant-numeric: tabular-nums; line-height: 1; margin-top: 4px; }
  .label { font-size: 12px; opacity: .92; margin-top: -4px; }
  .bar { width: 100%; height: 4px; border-radius: 4px; background: rgba(0,0,0,.28); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: #f3c9a8;
             transform: scaleX(0); transform-origin: left center; transition: transform .5s linear; }
  .modes { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 180px; }
  .mode { border: 0; border-radius: 999px; padding: 7px 12px; background: var(--chip); color: var(--ink);
          font: inherit; font-size: 12px; cursor: pointer; }
  .mode[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); font-weight: 600; }
  .controls { display: flex; gap: 8px; width: 100%; justify-content: center; margin-top: 2px; }
  .btn { border: 0; border-radius: 999px; padding: 8px 18px; min-width: 76px; font: inherit; font-weight: 600;
         cursor: pointer; background: var(--chip-on); color: var(--chip-on-ink); }
  .btn.ghost { background: var(--chip); color: var(--ink); font-weight: 500; }
  button:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
  .meta { font-size: 11px; opacity: .92; }
</style>
</head>
<body>
<div class="card">
  <div class="time" id="time" role="timer" aria-live="polite">25:00</div>
  <div class="label" id="label">Focus</div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="modes" role="group" aria-label="Timer mode">
    <button class="mode" data-min="25" data-label="Focus" aria-pressed="true">Pomodoro · 25</button>
    <button class="mode" data-min="5" data-label="Short break" aria-pressed="false">Short break · 5</button>
    <button class="mode" data-min="15" data-label="Long break" aria-pressed="false">Long break · 15</button>
  </div>
  <div class="controls">
    <button class="btn" id="start">Start</button>
    <button class="btn ghost" id="reset">Reset</button>
  </div>
  <div class="meta" id="meta">0 sessions today</div>
</div>
<script>
(function () {
  var total = 1500, left = 1500, running = false, endAt = 0, tick = null, done = 0, label = "Focus";
  var $ = function (id) { return document.getElementById(id); };
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function paint() {
    $("time").textContent = fmt(left);
    $("bar").style.transform = "scaleX(" + ((total - left) / total) + ")";
    $("start").textContent = running ? "Pause" : (left < total ? "Resume" : "Start");
    $("label").textContent = label;
    document.title = running ? fmt(left) + " · " + label : "Focus Timer";
  }
  function beep() {
    try {
      var C = window.AudioContext || window.webkitAudioContext, c = new C();
      [0, .35, .7].forEach(function (t) {
        var o = c.createOscillator(), g = c.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(c.destination);
        g.gain.setValueAtTime(.001, c.currentTime + t);
        g.gain.exponentialRampToValueAtTime(.2, c.currentTime + t + .02);
        g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t + .25);
        o.start(c.currentTime + t); o.stop(c.currentTime + t + .3);
      });
    } catch (e) {}
  }
  function step() {
    left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (left === 0) {
      clearInterval(tick); running = false;
      if (total >= 1200) { done++; $("meta").textContent = done + (done === 1 ? " session" : " sessions") + " today · log it in Study Log"; }
      beep(); left = total;
    }
    paint();
  }
  $("start").onclick = function () {
    if (running) { clearInterval(tick); running = false; }
    else { endAt = Date.now() + left * 1000; running = true; tick = setInterval(step, 250); }
    paint();
  };
  $("reset").onclick = function () { clearInterval(tick); running = false; left = total; paint(); };
  Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      clearInterval(tick); running = false; total = left = (+b.dataset.min) * 60; label = b.dataset.label; paint();
    };
  });
  paint();
})();
</script>
</body>
</html>
