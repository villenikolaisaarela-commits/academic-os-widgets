<!doctype html><html><body style="background:#fff;color:#000;font:12px monospace;margin:6px">
<div id="o"></div>
<script>
var r=new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit"}).resolvedOptions();
document.getElementById("o").innerText=[
"href: "+location.href,
"top: "+(window===window.top),
"nav: "+navigator.language,
"resolved en-US -> "+r.locale,
"fmt: "+new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",hour12:true}).format(new Date()),
"ua: "+navigator.userAgent.slice(0,120)].join("\n");
</script></body></html>
