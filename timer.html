<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer</title>
<style>
  /* The timer has no card of its own: it paints the same background Notion uses, so the
     embed reads as part of the page.

     A `background: transparent` page does NOT show the Notion page behind it — an embedded
     frame is painted on the browser's own base canvas, which is white. That is why --bg has
     to match Notion exactly: #ffffff in light mode, #191919 in dark mode.

     An embedded page also cannot read Notion's theme, only the viewer's device setting, so
     ?theme=dark / ?theme=light pins it for anyone whose Notion theme differs from their device. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #2a2724; --muted: #6b645b;
    --accent: #4f6b57; --on-accent: #ffffff;
    --surface: rgba(42,39,36,.055);
    --surface-hover: rgba(42,39,36,.10);
    --line: rgba(42,39,36,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #191919;
      --ink: #f5f3f0; --muted: #9a958d;
      --accent: #8faf95; --on-accent: #191919;
      --surface: rgba(245,243,240,.07);
      --surface-hover: rgba(245,243,240,.13);
      --line: rgba(245,243,240,.16);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #191919;
    --ink: #f5f3f0; --muted: #9a958d;
    --accent: #8faf95; --on-accent: #191919;
    --surface: rgba(245,243,240,.07);
    --surface-hover: rgba(245,243,240,.13);
    --line: rgba(245,243,240,.16);
  }
  /* overflow:hidden keeps the embed from growing a scrollbar over a stray pixel or two;
     the vh-based sizing below means there is never real content to scroll to. */
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    font: 400 13px/1.35 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Every vertical measure scales with the embed's own height (vh inside an iframe is the
     embed's height), so the widget fits whatever size the block is dragged to instead of
     growing a scrollbar. The clamps keep it readable when the embed is small and stop it
     ballooning when the embed is tall. */
  .card { width: 100%; max-width: 320px; padding: clamp(8px, 2.5vh, 18px) 14px; box-sizing: border-box;
          display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 2.2vh, 13px); }
  .time { font-size: clamp(34px, 13vh, 62px); font-weight: 300; letter-spacing: -.02em;
          font-variant-numeric: tabular-nums; line-height: 1; }
  .label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: -6px; }
  .bar { width: 100%; max-width: 220px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--accent);
             transform: scaleX(0); transform-origin: left center; transition: transform .4s linear; }
  .modes { display: flex; flex-direction: column; gap: clamp(4px, 1.2vh, 6px); width: 100%; max-width: 190px; }
  .mode { border: 0; border-radius: 999px; padding: clamp(5px, 1.6vh, 9px) 14px; background: var(--surface); color: var(--muted);
          font: inherit; font-size: 12.5px; cursor: pointer; }
  .mode:hover { background: var(--surface-hover); color: var(--ink); }
  .mode[aria-pressed="true"] { background: var(--surface-hover); color: var(--ink); font-weight: 600; }
  .controls { display: flex; gap: 10px; }
  .btn { border: 0; border-radius: 999px; padding: clamp(6px, 1.8vh, 10px) 22px; min-width: 88px; font: inherit;
         font-weight: 600; font-size: 13px; cursor: pointer; background: var(--accent); color: var(--on-accent); }
  .btn:hover { filter: brightness(1.07); }
  .btn.ghost { background: var(--surface); color: var(--ink); font-weight: 500; }
  .btn.ghost:hover { background: var(--surface-hover); filter: none; }
  .btn:hover { transform: translateY(-1px); }
  .btn, .mode { transition: transform .12s ease, background .15s ease, color .15s ease, filter .15s ease; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dots { display: flex; gap: 6px; align-items: center; min-height: 9px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: block; }
  .meta { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="time" id="time">25:00</div>
  <div class="label" id="label">Study</div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="modes" role="group" aria-label="Timer mode">
    <button class="mode" data-min="25" data-label="Study" aria-pressed="true">study · 25 min</button>
    <button class="mode" data-min="5" data-label="Short break" aria-pressed="false">short break · 5 min</button>
    <button class="mode" data-min="15" data-label="Long break" aria-pressed="false">long break · 15 min</button>
  </div>
  <div class="controls">
    <button class="btn" id="start">start</button>
    <button class="btn ghost" id="reset">reset</button>
  </div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div class="meta" id="meta" role="status" aria-live="polite">no sessions yet today</div>
</div>
<script>
(function () {
  // ?theme=dark / ?theme=light pins the colour scheme (see the note in the stylesheet).
  var t = new URLSearchParams(location.search).get("theme");
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;

  var total = 1500, left = 1500, running = false, endAt = 0, ticker = null, done = 0, label = "Study";
  var $ = function (id) { return document.getElementById(id); };

  // The timer's state lives in this browser (localStorage), so a running session survives leaving
  // the page, and "today" really means today. Notion removes the embed when you open another page.
  var KEY = "framewise-timer" + (location.search.replace(/[?&](theme|v)=[^&]*/g, "") || ""), day = today();
  function today() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function store() {
    try { localStorage.setItem(KEY, JSON.stringify({ total: total, left: left, running: running, endAt: endAt, label: label, day: day, done: done })); }
    catch (e) { /* storage blocked: the timer still works for this visit */ }
  }
  function restore() {
    var st = null;
    try { st = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { st = null; }
    if (!st) return false;
    total = st.total || 1500; label = st.label || "Study"; left = Math.min(st.left || total, total);
    done = st.day === today() ? (st.done || 0) : 0; day = today();
    running = false;
    if (st.running && st.endAt) {
      if (st.endAt > Date.now()) { left = Math.max(1, Math.round((st.endAt - Date.now()) / 1000)); running = true; }
      else { if (label === "Study" && st.day === today()) done++; left = total; }   // finished while away
    }
    [].forEach.call(document.querySelectorAll(".mode"), function (x) {
      x.setAttribute("aria-pressed", x.dataset.label === label ? "true" : "false");
    });
    return true;
  }
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }

  function paintDots() {
    var wrap = $("dots");
    wrap.textContent = "";
    for (var i = 0; i < Math.min(done, 8); i++) wrap.appendChild(document.createElement("i"));
    $("meta").textContent = done === 0 ? "no sessions yet today"
      : done + (done === 1 ? " session today" : " sessions today");
  }

  function paint() {
    $("time").textContent = fmt(left);
    $("bar").style.transform = "scaleX(" + ((total - left) / total) + ")";
    $("start").textContent = running ? "pause" : (left < total ? "resume" : "start");
    $("label").textContent = label;
    document.title = fmt(left) + " · " + label;
  }

  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext, ctx = new Ctx();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 660;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.1);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 1.2);
    } catch (e) { /* no audio available */ }
  }

  function stop() { running = false; clearInterval(ticker); ticker = null; paint(); store(); }

  function run() {
    running = true;
    endAt = Date.now() + left * 1000;
    try { var st = JSON.parse(localStorage.getItem(KEY) || "null"); if (st && st.running && st.endAt > Date.now() && st.label === label) endAt = st.endAt; } catch (e) {}
    clearInterval(ticker);
    ticker = setInterval(function () {
      left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      if (left === 0) {
        if (day !== today()) { day = today(); done = 0; }
        if (label === "Study") done++;
        left = total;
        stop();
        paintDots();
        beep();
      }
      paint();
    }, 250);
    paint();
    store();
  }

  $("start").onclick = function () { running ? stop() : run(); };
  $("reset").onclick = function () { stop(); left = total; paint(); store(); };

  [].forEach.call(document.querySelectorAll(".mode"), function (b) {
    b.onclick = function () {
      [].forEach.call(document.querySelectorAll(".mode"), function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      stop();
      total = left = parseInt(b.dataset.min, 10) * 60;
      label = b.dataset.label;
      paint();
      store();
    };
  });

  // Another open copy of the timer (a second tab or device window) changed the state: follow it.
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    clearInterval(ticker); ticker = null;
    if (restore() && running) run(); else { paintDots(); paint(); }
  });

  var wasRunning = restore() && running;
  paintDots();
  paint();
  if (wasRunning) run();
})();
</script>
</body>
</html>
