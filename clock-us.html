<!doctype html>
<html lang="en-US" data-lang="en-US" data-h="12">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock</title>
<style>
  /* Theme-independent card: same warm palette as the focus timer, readable on Notion light and dark. */
  :root { --ink: #ffffff; --soft: #f1ddd0; --tick: rgba(255,255,255,.28); --tick-major: rgba(255,255,255,.7); --accent: #f3c9a8; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #3a1d14 0%, #5e2f20 55%, #7a3a26 100%);
    color: var(--ink);
    font: 13px/1.3 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { position: relative; width: min(88vw, 88vh, 260px); aspect-ratio: 1; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tick { stroke: var(--tick); stroke-width: 1.2; stroke-linecap: round; }
  .tick.major { stroke: var(--tick-major); stroke-width: 2; }
  .hand { stroke: var(--ink); stroke-linecap: round; }
  .hand.sec { stroke: var(--accent); }
  .pin { fill: var(--accent); }
  .readout { position: absolute; left: 0; right: 0; top: 62%; text-align: center; pointer-events: none; }
  .time { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .date { font-size: 11px; color: var(--soft); margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap" aria-label="Clock">
  <svg viewBox="-100 -100 200 200" aria-hidden="true">
    <g id="ticks"></g>
    <line id="h" class="hand" x1="0" y1="8" x2="0" y2="-46" stroke-width="4"/>
    <line id="m" class="hand" x1="0" y1="10" x2="0" y2="-68" stroke-width="2.5"/>
    <line id="s" class="hand sec" x1="0" y1="14" x2="0" y2="-78" stroke-width="1.2"/>
    <circle class="pin" r="3"/>
  </svg>
  <div class="readout">
    <div class="time" id="time" role="timer" aria-live="off">--:--:--</div>
    <div class="date" id="date"></div>
  </div>
</div>
<script>
(function () {
  // Region handling:
  //   default  -> language, date order and 12/24-hour format follow the viewer's device locale
  //   ?lang=en-US, ?lang=en-GB, ?lang=fi ... -> force a locale
  //   ?h=12 or ?h=24                         -> force the hour format
  //   <html data-lang="en-US" data-h="12"> -> per-file defaults (clock-us.html, clock-24.html),
  //   because Notion embeds may drop the query string.
  var q = new URLSearchParams(location.search), d = document.documentElement.dataset;
  var locale = q.get("lang") || d.lang || undefined;
  var hParam = q.get("h") || d.h;
  var hour12 = hParam === "12" ? true : hParam === "24" ? false : undefined;
  var timeFmt = new Intl.DateTimeFormat(locale, { hour: "numeric", minute: "2-digit", second: "2-digit", hour12: hour12 });
  var dateFmt = new Intl.DateTimeFormat(locale, { weekday: "short", month: "short", day: "numeric" });

  var g = document.getElementById("ticks"), ns = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 60; i++) {
    var major = i % 5 === 0, l = document.createElementNS(ns, "line");
    l.setAttribute("x1", 0); l.setAttribute("x2", 0);
    l.setAttribute("y1", major ? -92 : -94); l.setAttribute("y2", major ? -84 : -90);
    l.setAttribute("transform", "rotate(" + i * 6 + ")");
    l.setAttribute("class", major ? "tick major" : "tick");
    g.appendChild(l);
  }
  var H = document.getElementById("h"), M = document.getElementById("m"), S = document.getElementById("s");
  function tick() {
    var d = new Date(), s = d.getSeconds(), m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
    H.setAttribute("transform", "rotate(" + h * 30 + ")");
    M.setAttribute("transform", "rotate(" + m * 6 + ")");
    S.setAttribute("transform", "rotate(" + s * 6 + ")");
    document.getElementById("time").textContent = timeFmt.format(d);
    document.getElementById("date").textContent = dateFmt.format(d);
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
